<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>篮架计时器与24秒表自动测试仿真器</title>
    <style>
        @import url('https://fonts.cdnfonts.com/css/ds-digital');

        :root {
            --red: #ff2b2b;
            --orange: #ff7300;
            --yellow: #ffb800;
            --green: #2aff3d;
            --cyan: #00e5ff;
            --bg-dark: #030305;
            --chassis: #121215;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: var(--bg-dark);
            color: #fff;
            font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            padding: 20px;
        }

        /* 3D 虚拟篮架与计时器整合区 */
        .court-stage {
            background: radial-gradient(circle at center, #161620 0%, #050508 100%);
            border: 4px solid #1a1a22;
            border-radius: 20px;
            padding: 40px;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: min(96vw, 920px);
            min-height: 550px;
            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.8);
            overflow: hidden;
        }

        /* 网格扫网像素纹理 */
        .court-stage::before {
            content: "";
            position: absolute;
            inset: 0;
            pointer-events: none;
            background: linear-gradient(rgba(0, 0, 0, 0.45) 1px, transparent 1px),
                        linear-gradient(90deg, rgba(0, 0, 0, 0.45) 1px, transparent 1px);
            background-size: 3px 3px;
            z-index: 4;
            opacity: 0.75;
        }

        /* 篮架计时器机箱 */
        .shot-clock-chassis {
            background: var(--chassis);
            border: 4px solid #202025;
            border-radius: 12px;
            padding: 16px 24px;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.9), inset 0 0 10px rgba(255,255,255,0.03);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            z-index: 5;
            position: relative;
            margin-bottom: 15px;
            min-width: 290px;
        }

        /* 数码管字体 */
        .digit {
            font-family: 'DS-Digital', monospace;
            font-style: normal;
            font-variant-numeric: tabular-nums;
            line-height: 1;
            letter-spacing: 2px;
        }

        /* 游戏大表时间显示 */
        .game-timer-display {
            background: #000;
            border: 1px solid #1c1c22;
            border-radius: 6px;
            padding: 6px 15px;
            font-size: 3.4rem;
            min-width: 210px;
            text-align: center;
            box-shadow: inset 0 0 8px rgba(0,0,0,0.95);
        }

        .game-timer-display.led-green {
            color: var(--green);
            text-shadow: 0 0 12px rgba(42, 255, 61, 0.55);
        }

        .game-timer-display.led-orange {
            color: var(--orange);
            text-shadow: 0 0 12px rgba(255, 115, 0, 0.55);
        }

        /* 24秒表大屏显示 */
        .shot-clock-display {
            background: #000;
            border: 1px solid #1c1c22;
            border-radius: 8px;
            padding: 8px 20px;
            font-size: 7.2rem;
            min-width: 210px;
            text-align: center;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.95);
        }

        .shot-clock-display.led-red {
            color: var(--red);
            text-shadow: 0 0 20px rgba(255, 43, 43, 0.65);
        }

        /* 机箱底座支架 */
        .chassis-mount {
            width: 14px;
            height: 25px;
            background: linear-gradient(90deg, #111, #2a2a30, #111);
            z-index: 3;
        }

        /* 模拟篮板 */
        .backboard {
            width: 520px;
            height: 340px;
            border: 5px solid #dcdcdc;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(1.5px);
            border-radius: 8px;
            position: relative;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.6), inset 0 0 20px rgba(255, 255, 255, 0.03);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 2;
        }

        /* 篮板内侧白色小矩形 (射门目标区) */
        .shooting-square {
            width: 160px;
            height: 115px;
            border: 4px solid #fff;
            position: absolute;
            bottom: 35px;
            border-radius: 2px;
            opacity: 0.8;
        }

        /* 篮圈与篮网容器 */
        .hoop-assembly {
            position: absolute;
            bottom: 22px;
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 10;
        }

        /* 篮圈连接件 */
        .hoop-bracket {
            width: 28px;
            height: 12px;
            background: var(--orange);
            border-radius: 2px;
        }

        /* 篮圈 (3D透视椭圆) */
        .rim {
            width: 90px;
            height: 32px;
            border: 5px solid var(--orange);
            border-radius: 50%;
            margin-top: -5px;
            box-shadow: 0 6px 10px rgba(0,0,0,0.5);
            transform: rotateX(60deg);
            transform-origin: top center;
        }

        /* 篮网 SVG */
        .net {
            width: 76px;
            height: 90px;
            margin-top: -10px;
            opacity: 0.85;
        }

        /* 篮板红光 LED 灯带 */
        .backboard-led-strip {
            position: absolute;
            inset: 4px;
            border: 6px solid transparent;
            border-radius: 4px;
            pointer-events: none;
            z-index: 6;
        }

        /* 灯带激活状态 (红光闪烁) */
        .backboard-led-strip.active {
            border-color: var(--red);
            box-shadow: 0 0 35px var(--red), inset 0 0 35px var(--red);
            animation: pulse-led 0.3s infinite alternate;
        }

        @keyframes pulse-led {
            0% {
                opacity: 0.3;
                box-shadow: 0 0 10px var(--red), inset 0 0 10px var(--red);
            }
            100% {
                opacity: 1;
                box-shadow: 0 0 35px var(--red), inset 0 0 35px var(--red);
            }
        }

        /* 遮挡罩 */
        .occluder {
            display: none;
            position: absolute;
            z-index: 20;
            background: #000;
            border: 2px solid #151515;
        }

        .occluding .occluder {
            display: block;
        }

        .occ-timer {
            width: 250px;
            height: 75px;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
        }

        .occ-shotclock {
            width: 250px;
            height: 140px;
            top: 100px;
            left: 50%;
            transform: translateX(-50%);
        }

        /* 硬件故障闪烁 */
        .fault .digit {
            animation: flicker-clock 0.08s steps(2, end) infinite;
        }

        @keyframes flicker-clock {
            0% { opacity: 0.95; }
            50% { opacity: 0.1; }
            100% { opacity: 0.9; }
        }

        /* 顶部悬浮测试阶段标签 */
        .test-scenario-badge {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0, 229, 255, 0.12);
            border: 1px solid var(--cyan);
            color: var(--cyan);
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: bold;
            z-index: 10;
            backdrop-filter: blur(4px);
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .badge-pulse {
            width: 8px;
            height: 8px;
            background-color: var(--cyan);
            border-radius: 50%;
            animation: blinker 1s linear infinite;
        }

        @keyframes blinker {
            50% { opacity: 0; }
        }

        /* 状态条 */
        .status-display {
            background: rgba(0, 0, 0, 0.4);
            padding: 10px 18px;
            border-radius: 8px;
            border-left: 4px solid var(--cyan);
            margin-top: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.95rem;
            width: 100%;
            z-index: 5;
            backdrop-filter: blur(2px);
        }

        .status-msg {
            color: #ccc;
        }

        .status-meta {
            font-family: monospace;
            color: #888;
        }

        .bottom-hint {
            margin-top: 15px;
            font-size: 0.85rem;
            color: #555;
            text-align: center;
        }
    </style>
</head>

<body>

    <div class="court-stage" id="courtStage">
        <!-- 自动播放阶段标签 -->
        <div class="test-scenario-badge">
            <span class="badge-pulse"></span>
            <span id="currentScenarioText">主时钟正常走表中...</span>
        </div>

        <!-- 篮架计时器部分 -->
        <div id="clockUnit" class="shot-clock-chassis">
            <div id="occTimer" class="occluder occ-timer"></div>
            <div id="occShotClock" class="occluder occ-shotclock"></div>

            <!-- 比赛大表计时器 -->
            <div id="gameTimer" class="game-timer-display digit led-green">10:00</div>
            
            <!-- 24/14秒表 -->
            <div id="shotClock" class="shot-clock-display digit led-red">24</div>
        </div>

        <div class="chassis-mount"></div>

        <!-- 篮板与篮圈 -->
        <div id="backboard" class="backboard">
            <div id="backboardLed" class="backboard-led-strip"></div>
            <div class="shooting-square"></div>
            
            <!-- 篮圈与篮网组件 -->
            <div class="hoop-assembly">
                <div class="hoop-bracket"></div>
                <div class="rim"></div>
                <svg class="net" viewBox="0 0 100 120" xmlns="http://www.w3.org/2000/svg">
                    <path d="M 10,0 L 20,20 M 20,0 L 28,20 M 35,0 L 36,20 M 50,0 L 44,20 M 65,0 L 56,20 M 80,0 L 72,20 M 90,0 L 80,20" stroke="#ddd" stroke-width="2" />
                    <path d="M 10,10 C 30,25 40,35 50,50 C 60,65 70,85 80,110" fill="none" stroke="#eee" stroke-width="2" stroke-dasharray="3,3" />
                    <path d="M 90,10 C 70,25 60,35 50,50 C 40,65 30,85 20,110" fill="none" stroke="#eee" stroke-width="2" stroke-dasharray="3,3" />
                    <path d="M 30,10 C 45,30 55,50 65,75 C 70,90 75,100 78,110" fill="none" stroke="#ddd" stroke-width="1.5" />
                    <path d="M 70,10 C 55,30 45,50 35,75 C 30,90 25,100 22,110" fill="none" stroke="#ddd" stroke-width="1.5" />
                    <ellipse cx="50" cy="30" rx="36" ry="6" fill="none" stroke="#ccc" stroke-width="1.5" />
                    <ellipse cx="50" cy="55" rx="28" ry="5" fill="none" stroke="#ccc" stroke-width="1.5" />
                    <ellipse cx="50" cy="80" rx="20" ry="4" fill="none" stroke="#bbb" stroke-width="1.5" />
                    <ellipse cx="50" cy="105" rx="14" ry="3" fill="none" stroke="#999" stroke-width="2" />
                </svg>
            </div>
        </div>

        <!-- 状态流显示 -->
        <div class="status-display">
            <div id="statusMsg" class="status-msg">主时钟走时已运行...</div>
            <div id="statusMeta" class="status-meta">时限: --:-- | 秒表: --s</div>
        </div>
    </div>

    <div class="bottom-hint">
        全自动真实模拟计时 • 无需操作 • 开屏即动 • 静音运行
    </div>

    <!-- 自动测试控制内核 -->
    <script>
        // 计时状态
        let state = {
            gameTime: 600.0,     // 从 10 分钟连续递减
            shotClock: 24.0,    // 进攻秒表
            elapsed: 0.0,       // 整个循环流逝的实际秒数
            running: true,      // 自动运行
            shotClockLocked: false,
            activeVisuals: [],
            backboardActive: false
        };

        let lastTimestamp = null;
        let animationFrameId = null;

        // 获取元素
        const gameTimerEl = document.getElementById('gameTimer');
        const shotClockEl = document.getElementById('shotClock');
        const backboardLedEl = document.getElementById('backboardLed');
        const clockUnitEl = document.getElementById('clockUnit');
        const statusMsgEl = document.getElementById('statusMsg');
        const statusMetaEl = document.getElementById('statusMeta');
        const scenarioBadgeText = document.getElementById('currentScenarioText');

        // 格式化大表时间 (分:秒)
        function formatGameTime(seconds) {
            if (seconds <= 0) return "00:00.0";
            if (seconds >= 60) {
                const m = Math.floor(seconds / 60);
                const s = Math.floor(seconds % 60);
                return String(m).padStart(2, '0') + ":" + String(s).padStart(2, '0');
            } else {
                // 当时间少于 1 分钟时，显示秒.10毫秒 (如 12.4秒)
                const s = Math.floor(seconds);
                const tenths = Math.floor((seconds - s) * 10);
                return String(s).padStart(2, '0') + "." + tenths;
            }
        }

        // 格式化 24秒表时间
        function formatShotClock(seconds) {
            if (seconds <= 0) return "00";
            const s = Math.ceil(seconds);
            return String(s).padStart(2, '0');
        }

        function showEventLog(msg) {
            statusMsgEl.innerText = msg;
            scenarioBadgeText.innerText = msg;
        }

        // 更新大表与秒表的颜色样式
        function updateColorsAndLED() {
            // 大表颜色
            if (state.gameTime <= 0 || state.gameTime < 60) {
                gameTimerEl.classList.remove('led-green');
                gameTimerEl.classList.add('led-orange');
            } else {
                gameTimerEl.classList.remove('led-orange');
                gameTimerEl.classList.add('led-green');
            }

            // 检查篮板红灯 LED 激活情况
            if (state.backboardActive) {
                backboardLedEl.classList.add('active');
            } else {
                backboardLedEl.classList.remove('active');
            }
        }

        // 刷新渲染页面显示
        function updateDisplay() {
            gameTimerEl.innerText = formatGameTime(state.gameTime);
            shotClockEl.innerText = formatShotClock(state.shotClock);

            updateColorsAndLED();

            // 特效渲染 (遮挡、闪烁故障)
            clockUnitEl.classList.toggle('fault', hasVisual('fault'));
            clockUnitEl.classList.toggle('occluding', hasVisual('occlude-timer') || hasVisual('occlude-shotclock'));
            
            document.getElementById('occTimer').style.display = hasVisual('occlude-timer') ? 'block' : 'none';
            document.getElementById('occShotClock').style.display = hasVisual('occlude-shotclock') ? 'block' : 'none';

            // 元数据状态栏
            statusMetaEl.innerText = `大表: ${formatGameTime(state.gameTime)} | 秒表: ${state.shotClock.toFixed(1)}s | 实际流逝: ${state.elapsed.toFixed(1)}s`;
        }

        // 核心走时Loop
        function mainLoop(timestamp) {
            if (!state.running) {
                lastTimestamp = null;
                return;
            }

            if (!lastTimestamp) {
                lastTimestamp = timestamp;
                animationFrameId = requestAnimationFrame(mainLoop);
                return;
            }

            const delta = (timestamp - lastTimestamp) / 1000;
            lastTimestamp = timestamp;

            // 1. 递增本轮实际流逝时间
            state.elapsed += delta;

            // 2. 递减比赛大表时间
            if (state.gameTime > 0) {
                state.gameTime = Math.max(0, state.gameTime - delta);
            } else {
                state.running = false;
                triggerPeriodEnd();
                return;
            }

            // 3. 递减 24 秒表时间 (如果是强制违例阶段，则不进行随机碰铁重置)
            const isViolationImminent = (state.elapsed >= 65 && state.elapsed <= 70); 

            if (state.shotClock > 0 && !state.shotClockLocked) {
                state.shotClock = Math.max(0, state.shotClock - delta);
            }

            // 秒表到期触发
            if (state.shotClock <= 0) {
                triggerShotClockViolation();
            } else if (!isViolationImminent) {
                // 常规情况下，每当进攻时间小于 8 秒时，有概率投篮出手重置为 24 或 14 秒 (模拟正常球局)
                if (state.shotClock < 8.0 && Math.random() > 0.985) {
                    const resetVal = Math.random() > 0.4 ? 24.0 : 14.0;
                    state.shotClock = resetVal;
                    showEventLog(`🏀 投篮命中篮圈，秒表复位至 ${resetVal} 秒`);
                }
            }

            // 4. 清理到期特效
            expireVisuals(delta);

            // 5. 触发预设扰动事件 (基于连续流逝时间，不跳变主时间)
            handleScheduledEvents();

            updateDisplay();

            if (state.running) {
                animationFrameId = requestAnimationFrame(mainLoop);
            }
        }

        // 视觉特效控制
        function hasVisual(type) {
            return state.activeVisuals.some(v => v.type === type);
        }

        function addVisual(type, duration) {
            state.activeVisuals.push({ type, remaining: duration });
        }

        function expireVisuals(delta) {
            state.activeVisuals.forEach(v => v.remaining -= delta);
            state.activeVisuals = state.activeVisuals.filter(v => v.remaining > 0);
        }

        // ==========================================
        // 全自动测试步骤循环调度引擎 (基于连续跑表时间轴)
        // ==========================================

        let eventFlags = {
            occludeTimerDone: false,
            occludeShotClockDone: false,
            flickerDone: false,
            rollbackDone: false,
            violationForced: false
        };

        function handleScheduledEvents() {
            const elapsed = state.elapsed;

            // 1. 跑表到 12 秒：大表被遮挡 3.5 秒
            if (elapsed >= 12 && !eventFlags.occludeTimerDone) {
                eventFlags.occludeTimerDone = true;
                addVisual('occlude-timer', 3.5);
                showEventLog("⚠️ 测试事件：大表发生临时被遮挡 3.5 秒 (测试OCR断点恢复)");
            }

            // 2. 跑表到 24 秒：24秒表被人影遮挡 3 秒
            if (elapsed >= 24 && !eventFlags.occludeShotClockDone) {
                eventFlags.occludeShotClockDone = true;
                addVisual('occlude-shotclock', 3.0);
                showEventLog("⚠️ 测试事件：24秒表被人员遮挡 3 秒");
            }

            // 3. 跑表到 36 秒：LED显示屏高频频闪 4 秒
            if (elapsed >= 36 && !eventFlags.flickerDone) {
                eventFlags.flickerDone = true;
                addVisual('fault', 4.0);
                showEventLog("⚡ 测试事件：数码管发生高频频闪故障 (测试OCR去抖动过滤)");
            }

            // 4. 跑表到 48 秒：模拟裁判吹哨判定并回表 2.6 秒
            if (elapsed >= 48 && !eventFlags.rollbackDone) {
                eventFlags.rollbackDone = true;
                triggerRefereeRollback();
            }

            // 5. 跑表到 65 秒：强制让进攻秒表从 5 秒起步且不被重新设定，直到 0 秒违例
            if (elapsed >= 65 && !eventFlags.violationForced) {
                eventFlags.violationForced = true;
                state.shotClock = 5.0; 
                showEventLog("⏰ 测试事件：模拟防守成功，迫使进攻方24秒违例倒数");
            }
        }

        // 模拟裁判调表 (正常回滚)
        function triggerRefereeRollback() {
            state.running = false;
            showEventLog("📐 测试事件：裁判鸣哨停表，准备回放审查...");
            updateDisplay();

            setTimeout(() => {
                // 仅安全回表 2.6 秒
                state.gameTime += 2.6;
                state.elapsed = Math.max(0, state.elapsed - 2.6); // 同步回滚流逝时间线，防事件重叠
                showEventLog("📐 测试事件：判定回滚！大表调表回退 2.6 秒。");
                updateDisplay();

                setTimeout(() => {
                    state.running = true;
                    lastTimestamp = null;
                    animationFrameId = requestAnimationFrame(mainLoop);
                    showEventLog("📐 时钟恢复运行。");
                    updateDisplay();
                }, 1500);
            }, 1500);
        }

        // 模拟24秒违例
        function triggerShotClockViolation() {
            state.running = false;
            state.backboardActive = true;
            showEventLog("⏰ 测试事件：24秒进攻时间违例！篮板红灯亮起。");
            updateDisplay();

            setTimeout(() => {
                state.backboardActive = false;
                state.shotClock = 24.0;
                state.running = true;
                lastTimestamp = null;
                animationFrameId = requestAnimationFrame(mainLoop);
                showEventLog("时钟恢复运行。");
                updateDisplay();
            }, 2000);
        }

        // 模拟一节比赛耗尽
        function triggerPeriodEnd() {
            state.backboardActive = true;
            showEventLog("🔔 比赛结束！本节大表走完，终场红灯亮起。");
            updateDisplay();

            setTimeout(() => {
                // 循环重置
                state.backboardActive = false;
                state.gameTime = 600.0;
                state.shotClock = 24.0;
                state.elapsed = 0.0;
                
                eventFlags.occludeTimerDone = false;
                eventFlags.occludeShotClockDone = false;
                eventFlags.flickerDone = false;
                eventFlags.rollbackDone = false;
                eventFlags.violationForced = false;

                state.running = true;
                lastTimestamp = null;
                animationFrameId = requestAnimationFrame(mainLoop);
                showEventLog("循环重置成功，重新开始 10 分钟倒计时计时...");
                updateDisplay();
            }, 3000);
        }

        // 页面加载后即刻开始走表
        window.addEventListener('DOMContentLoaded', () => {
            lastTimestamp = null;
            animationFrameId = requestAnimationFrame(mainLoop);
        });
    </script>
</body>

</html>
