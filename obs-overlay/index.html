<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>高光记分 - OBS 专业直播记分牌</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <!-- 网页端/OBS 实时连接状态标识栏 (支持点击一键修改房间号) -->
  <div class="ws-status-banner" id="ws-status-banner">
    <span class="status-dot"></span>
    <span class="status-text" id="ws-status-text">⏳ 正在连接中控台...</span>
    <button class="ws-room-edit-btn" id="ws-room-edit-btn" title="点击修改 6 位房间号">🔑 房间号: <span id="ws-current-room-text">666888</span> [修改]</button>
  </div>

  <!-- 房间号快速设置/切换弹窗 (首次或点击修改时使用) -->
  <div class="room-setting-modal room-modal--hidden" id="room-setting-modal">
    <div class="room-modal-card">
      <div class="room-modal-header">
        <span class="modal-title">🔑 设置 OBS 记分牌房间号</span>
        <span class="modal-close-btn" id="room-modal-close">×</span>
      </div>
      <div class="room-modal-body">
        <p class="modal-desc">请输入小程序网页记分中控台显示的 6 位房间码：</p>
        <div class="modal-input-row">
          <input type="text" id="room-modal-input" maxlength="6" placeholder="例如: 178800" value="178800">
          <button id="room-modal-submit-btn">保存并连接</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 左侧灵动岛专业电视转播级「LIVE 现场直播」纵向遮罩角标 (贴边零边距，放大1倍，支持一键关闭) -->
  <div class="dynamic-island-badge" id="dynamic-island-badge" title="可拖动调整位置，滚轮可等比缩放大小">
    <!-- 关闭按钮 -->
    <div class="live-close-btn" id="live-close-btn" title="关闭直播标识">×</div>

    <div class="live-top-pill">
      <span class="live-pulse-dot"></span>
      <span class="live-en-text">LIVE</span>
    </div>
    <div class="live-v-divider"></div>
    <div class="live-vertical-title" id="live-title">
      <span>现</span>
      <span>场</span>
      <span>直</span>
      <span>播</span>
    </div>
    <div class="island-resize-handle" id="island-resize-handle"></div>
  </div>

  <!-- 16:9 全高清广播级自适应转播记分牌 (居中底部，结构样式与小程序 live 页 100% 对齐) -->
  <div class="obs-container" id="obs-container">
    <div class="broadcast-scoreboard-wrapper" id="scoreboard-wrapper">
      <div class="broadcast-scoreboard" id="scoreboard">
        <!-- 顶部比赛名称 (纯透明背景，大字号高清投影) -->
        <div class="match-title-row">
          <span class="match-title-text" id="match-title">常规赛</span>
        </div>

        <!-- 核心记分条主体 (与 live.wxml 中的 score-bar-core 结构完全一致，居中显示) -->
        <div class="score-bar-core" id="score-bar-core">
          <!-- 主队板块 (左侧圆角 + 纯色背景 + 队名居中 + 分数靠内) -->
          <div class="team-group team-a-group" id="home-group">
            <div class="team-group-bg team-group-bg--left" id="home-ribbon" style="background-color: #E64340;"></div>
            <div class="team-group-row">
              <span class="team-name team-name--home" id="home-name">主队</span>
              <span class="score-value team-score--home" id="home-score">0</span>
            </div>
          </div>

          <!-- 中间节次立体高光胶囊 (上红中蓝下深蓝经典渐变) -->
          <div class="period-center-outer" id="period-center-outer">
            <div class="period-strip"></div>
            <div class="period-container">
              <span class="period-text" id="period-badge">第 1 节</span>
            </div>
          </div>

          <!-- 客队板块 (右侧圆角 + 纯色背景 + 分数靠内 + 队名居中) -->
          <div class="team-group team-b-group" id="away-group">
            <div class="team-group-bg team-group-bg--right" id="away-ribbon" style="background-color: #10AEFF;"></div>
            <div class="team-group-row">
              <span class="score-value team-score--away" id="away-score">0</span>
              <span class="team-name team-name--away" id="away-name">客队</span>
            </div>
          </div>

          <!-- 画面实时裁剪同步：自适应动态宽度切图时间容器 (定位在 score-bar-core 右侧旁，不影响记分牌居中) -->
          <div class="crop-time-box crop-time-box--hidden" id="time-crop-box">
            <canvas id="time-crop-canvas" class="crop-time-canvas"></canvas>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- 全屏高光回放角标图层 (悬浮在 OBS 媒体源之上) -->
  <div class="replay-overlay-container replay-hidden" id="replay-overlay-container">
    <!-- 广播级回放角标 (播放高光视频时悬浮展示) -->
    <div class="replay-corner-badge" id="replay-corner-badge">
      <span class="replay-dot"></span>
      <span class="replay-text" id="replay-corner-text">精彩回放 REPLAY</span>
    </div>
  </div>

  <!-- 专业广播级回放转场遮罩（与小程序 live 页结构完全一致） -->
  <div class="replay-mask replay-mask--hidden" id="replay-mask">
    <!-- 动感斜向 Wipe 切割光条 -->
    <div class="replay-stinger-wipe"></div>
    <div class="replay-stinger-slash"></div>

    <!-- 广播级 3D 悬浮勋章徽标层 -->
    <div class="replay-badge-container">
      <div class="replay-badge-card" id="replay-badge-card">
        <div class="replay-badge-icon-box">
          <span class="replay-badge-flash">⚡</span>
        </div>
        <div class="replay-badge-content">
          <div class="replay-badge-main" id="replay-badge-main">精彩回放</div>
          <div class="replay-badge-sub" id="replay-badge-sub">HIGHLIGHT REPLAY</div>
        </div>
        <div class="replay-badge-shimmer"></div>
      </div>
    </div>
  </div>

  <!-- 🛠️ 网页内置可视化实时调试面板（按键盘 D 键或加 ?debug=1 开启） -->
  <div class="obs-debug-panel" id="obs-debug-panel" style="display: none;">
    <div class="debug-header">
      <span class="debug-title">🛠️ OBS Overlay 实时调试控制台</span>
      <button class="debug-close-btn" id="debug-close-btn">✕</button>
    </div>
    <div class="debug-body">
      <div class="debug-row">
        <span class="debug-label">📡 房间状态:</span>
        <span class="debug-val" id="dbg-room-status">检测中...</span>
      </div>
      <div class="debug-row">
        <span class="debug-label">🖥️ OBS WS:</span>
        <span class="debug-val" id="dbg-obs-status">连接中(4455)...</span>
      </div>
      <div class="debug-row">
        <span class="debug-label">🎬 媒体状态:</span>
        <span class="debug-val" id="dbg-media-status">闲置 (NONE)</span>
      </div>
      <div class="debug-row">
        <span class="debug-label">📋 切片队列:</span>
        <span class="debug-val" id="dbg-queue-count">0 段切片</span>
      </div>
      
      <!-- 快捷调试操作按钮 -->
      <div class="debug-actions">
        <button class="dbg-btn dbg-btn-danger" id="dbg-btn-stop">⏹ 立即中断切回直播</button>
        <button class="dbg-btn" id="dbg-btn-clear-queue">🗑️ 清空切片历史</button>
      </div>

      <!-- 调试控制台内置切片精准点播列表 -->
      <div class="debug-clips-section">
        <div style="font-size: 11px; color: #94a3b8; margin: 4px 0 2px; display: flex; justify-content: space-between;">
          <span style="font-weight: bold; color: #cbd5e1;">🎬 捕获切片列表 (点击直接测试播放):</span>
          <span id="dbg-clips-tip" style="color: #00f0ff; font-weight: bold;">0 段</span>
        </div>
        <div class="debug-clips-list" id="dbg-clips-list">
          <div style="color: #64748b; font-size: 11px; text-align: center; padding: 6px;">暂无捕获切片</div>
        </div>
      </div>

      <!-- 实时日志窗 -->
      <div class="debug-logs" id="dbg-logs-box">
        <div class="dbg-log-item">系统初始化就绪...</div>
      </div>
    </div>
  </div>

  <script src="./config.js"></script>
  <script src="./overlay.js"></script>
</body>
</html>
