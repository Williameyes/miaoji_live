<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>高光记分 - OBS 专业直播记分牌</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <!-- 网页端/OBS 实时连接状态标识栏 (极简微型提示) -->
  <div class="ws-status-banner" id="ws-status-banner">
    <span class="status-dot"></span>
    <span class="status-text" id="ws-status-text">⏳ 正在连接中控台...</span>
  </div>

  <!-- 左侧灵动岛专业电视转播级「LIVE 现场直播」纵向遮罩角标 -->
  <div class="dynamic-island-badge" id="dynamic-island-badge" title="可拖动调整位置，滚轮可等比缩放大小">
    <div class="live-top-pill">
      <span class="live-pulse-dot"></span>
      <span class="live-en-text">LIVE</span>
    </div>
    <div class="live-v-divider"></div>
    <div class="live-vertical-title" id="live-title">
      <span>现</span>
      <span>场</span>
      <span>直</span>
      <span>播</span>
    </div>
    <div class="island-resize-handle" id="island-resize-handle"></div>
  </div>

  <!-- 16:9 全高清广播级自适应转播记分牌 (居中底部，结构样式与小程序 live 页 100% 对齐) -->
  <div class="obs-container" id="obs-container">
    <div class="broadcast-scoreboard-wrapper" id="scoreboard-wrapper">
      <div class="broadcast-scoreboard" id="scoreboard">
        <!-- 顶部比赛名称 (精致半透深色胶囊) -->
        <div class="match-title-row">
          <span class="match-title-text" id="match-title">常规赛</span>
        </div>

        <!-- 核心记分条主体 (与 live.wxml 中的 score-bar-core 结构完全一致) -->
        <div class="score-bar-core" id="score-bar-core">
          <!-- 主队板块 (左侧圆角 + 纯色背景 + 队名居中 + 分数靠内) -->
          <div class="team-group team-a-group" id="home-group">
            <div class="team-group-bg team-group-bg--left" id="home-ribbon" style="background-color: #E64340;"></div>
            <div class="team-group-row">
              <span class="team-name team-name--home" id="home-name">主队</span>
              <span class="score-value team-score--home" id="home-score">0</span>
            </div>
          </div>

          <!-- 中间节次立体高光胶囊 (上红中蓝下深蓝经典渐变) -->
          <div class="period-center-outer" id="period-center-outer">
            <div class="period-strip"></div>
            <div class="period-container">
              <span class="period-text" id="period-badge">第 1 节</span>
            </div>
          </div>

          <!-- 客队板块 (右侧圆角 + 纯色背景 + 分数靠内 + 队名居中) -->
          <div class="team-group team-b-group" id="away-group">
            <div class="team-group-bg team-group-bg--right" id="away-ribbon" style="background-color: #10AEFF;"></div>
            <div class="team-group-row">
              <span class="score-value team-score--away" id="away-score">0</span>
              <span class="team-name team-name--away" id="away-name">客队</span>
            </div>
          </div>

          <!-- 画面实时裁剪同步：自适应动态宽度切图时间容器 (定位在 score-bar-core 右侧，零拉伸不变形，隐藏时不占位) -->
          <div class="crop-time-box crop-time-box--hidden" id="time-crop-box">
            <canvas id="time-crop-canvas" class="crop-time-canvas"></canvas>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="./overlay.js"></script>
</body>
</html>
