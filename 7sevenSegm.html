<html lang="zh-CN"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    
    <title>实体级七段式LED记分牌模拟器</title>
    <style>
        :root {
            --led-red: #ff2222;
            --led-red-bg: #220505;
            --led-green: #22ff44;
            --led-green-bg: #05220a;
            --led-yellow: #ffcc00;
            --led-yellow-bg: #221a05;
        }

        body {
            background-color: #050505;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: "Microsoft YaHei", sans-serif;
            overflow: hidden;
        }

        /* 实体外壳 */
        .scoreboard-frame {
            background: linear-gradient(145deg, #1a1a1a, #0a0a0a);
            border: 12px solid #333;
            border-radius: 8px;
            padding: 40px;
            box-shadow: 0 50px 100px rgba(0,0,0,0.9), inset 0 0 20px rgba(0,0,0,0.5);
            width: 90vw;
            max-width: 1200px;
            position: relative;
        }

        /* 模拟LED点阵纹理层 */
        .scoreboard-frame::after {
            content: " ";
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-image: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.15) 50%), 
                              linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
            background-size: 100% 4px, 4px 100%;
            pointer-events: none;
            z-index: 10;
        }

        .header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 30px;
        }

        .team-name {
            font-size: 2.2rem;
            color: #ccc;
            font-weight: bold;
            border: 2px solid #222;
            padding: 8px 35px;
            background: #000;
            letter-spacing: 2px;
        }

        .main-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #000;
            padding: 30px;
            border-radius: 4px;
            box-shadow: inset 0 0 40px #000;
            gap: 20px;
        }

        /* SVG 样式 */
        .digit-svg { height: 180px; filter: drop-shadow(0 0 12px var(--led-red)); }
        .timer-svg { height: 100px; filter: drop-shadow(0 0 8px var(--led-green)); }
        .shot-svg { height: 130px; filter: drop-shadow(0 0 12px var(--led-red)); }
        .foul-svg { height: 70px; filter: drop-shadow(0 0 6px var(--led-red)); }

        .segment { fill: var(--led-red-bg); transition: fill 0.1s; }
        .on { fill: var(--led-red); }

        .timer-svg .segment { fill: var(--led-green-bg); }
        .timer-svg .on { fill: var(--led-green); }

        /* 冒号 */
        .colon-box {
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 25px;
            padding: 0 15px;
        }
        .dot {
            width: 14px;
            height: 14px;
            background-color: var(--led-green);
            border-radius: 50%;
            box-shadow: 0 0 12px var(--led-green);
        }
        .blink { animation: blink-anim 1s infinite; }
        @keyframes blink-anim { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

        .footer-row {
            display: flex;
            justify-content: space-around;
            align-items: flex-end;
            margin-top: 40px;
        }

        .label { color: #444; text-align: center; font-size: 1.1rem; margin-top: 8px; font-weight: bold; }

        /* 控制按钮 */
        .controls {
            margin-top: 50px;
            display: flex;
            gap: 20px;
        }
        button {
            padding: 12px 30px;
            background: #222;
            border: 1px solid #444;
            color: #eee;
            font-weight: bold;
            cursor: pointer;
            border-radius: 4px;
            transition: 0.2s;
        }
        button:hover { background: #333; border-color: #666; }
        button:active { background: #111; }
    </style>
</head>
<body>

<div class="scoreboard-frame">
    <div class="header">
        <div class="team-name">成都 1 队</div>
        <div style="color:var(--led-yellow); font-size: 1.8rem; letter-spacing: 5px; font-weight: bold; text-shadow: 0 0 10px var(--led-yellow);">PERIOD 3</div>
        <div class="team-name">北京 2 队</div>
    </div>

    <div class="main-row">

        <div style="text-align: center; flex: 0 0 auto;">
            <div id="timer-display" style="display:flex; align-items: center;">
                <div id="m-tens"><svg viewBox="-10 -10 120 220" class="timer-svg"><path d="M 10 0 L 90 0 L 80 10 L 20 10 Z" class="segment a on"></path><path d="M 100 10 L 100 90 L 90 80 L 90 20 Z" class="segment b on"></path><path d="M 100 110 L 100 190 L 90 180 L 90 120 Z" class="segment c on"></path><path d="M 10 200 L 90 200 L 80 190 L 20 190 Z" class="segment d on"></path><path d="M 0 110 L 0 190 L 10 180 L 10 120 Z" class="segment e on"></path><path d="M 0 10 L 0 90 L 10 80 L 10 20 Z" class="segment f on"></path><path d="M 15 100 L 85 100 L 75 110 L 25 110 L 15 100 L 25 90 L 75 90 Z" class="segment g"></path></svg></div><div id="m-units"><svg viewBox="-10 -10 120 220" class="timer-svg"><path d="M 10 0 L 90 0 L 80 10 L 20 10 Z" class="segment a on"></path><path d="M 100 10 L 100 90 L 90 80 L 90 20 Z" class="segment b on"></path><path d="M 100 110 L 100 190 L 90 180 L 90 120 Z" class="segment c on"></path><path d="M 10 200 L 90 200 L 80 190 L 20 190 Z" class="segment d on"></path><path d="M 0 110 L 0 190 L 10 180 L 10 120 Z" class="segment e on"></path><path d="M 0 10 L 0 90 L 10 80 L 10 20 Z" class="segment f on"></path><path d="M 15 100 L 85 100 L 75 110 L 25 110 L 15 100 L 25 90 L 75 90 Z" class="segment g"></path></svg></div>
                <div class="colon-box"><div class="dot blink"></div><div class="dot blink"></div></div>
                <div id="s-tens"><svg viewBox="-10 -10 120 220" class="timer-svg"><path d="M 10 0 L 90 0 L 80 10 L 20 10 Z" class="segment a on"></path><path d="M 100 10 L 100 90 L 90 80 L 90 20 Z" class="segment b on"></path><path d="M 100 110 L 100 190 L 90 180 L 90 120 Z" class="segment c on"></path><path d="M 10 200 L 90 200 L 80 190 L 20 190 Z" class="segment d on"></path><path d="M 0 110 L 0 190 L 10 180 L 10 120 Z" class="segment e on"></path><path d="M 0 10 L 0 90 L 10 80 L 10 20 Z" class="segment f on"></path><path d="M 15 100 L 85 100 L 75 110 L 25 110 L 15 100 L 25 90 L 75 90 Z" class="segment g"></path></svg></div><div id="s-units"><svg viewBox="-10 -10 120 220" class="timer-svg"><path d="M 10 0 L 90 0 L 80 10 L 20 10 Z" class="segment a on"></path><path d="M 100 10 L 100 90 L 90 80 L 90 20 Z" class="segment b on"></path><path d="M 100 110 L 100 190 L 90 180 L 90 120 Z" class="segment c on"></path><path d="M 10 200 L 90 200 L 80 190 L 20 190 Z" class="segment d on"></path><path d="M 0 110 L 0 190 L 10 180 L 10 120 Z" class="segment e on"></path><path d="M 0 10 L 0 90 L 10 80 L 10 20 Z" class="segment f on"></path><path d="M 15 100 L 85 100 L 75 110 L 25 110 L 15 100 L 25 90 L 75 90 Z" class="segment g"></path></svg></div>
            </div>
            <div class="label" style="color: #333;">MATCH TIME</div>
        </div>

        <div id="guest-score" style="display:flex; gap:12px;"><svg viewBox="-10 -10 120 220" class="digit-svg"><path d="M 10 0 L 90 0 L 80 10 L 20 10 Z" class="segment a"></path><path d="M 100 10 L 100 90 L 90 80 L 90 20 Z" class="segment b on"></path><path d="M 100 110 L 100 190 L 90 180 L 90 120 Z" class="segment c on"></path><path d="M 10 200 L 90 200 L 80 190 L 20 190 Z" class="segment d"></path><path d="M 0 110 L 0 190 L 10 180 L 10 120 Z" class="segment e"></path><path d="M 0 10 L 0 90 L 10 80 L 10 20 Z" class="segment f"></path><path d="M 15 100 L 85 100 L 75 110 L 25 110 L 15 100 L 25 90 L 75 90 Z" class="segment g"></path></svg><svg viewBox="-10 -10 120 220" class="digit-svg"><path d="M 10 0 L 90 0 L 80 10 L 20 10 Z" class="segment a on"></path><path d="M 100 10 L 100 90 L 90 80 L 90 20 Z" class="segment b"></path><path d="M 100 110 L 100 190 L 90 180 L 90 120 Z" class="segment c on"></path><path d="M 10 200 L 90 200 L 80 190 L 20 190 Z" class="segment d on"></path><path d="M 0 110 L 0 190 L 10 180 L 10 120 Z" class="segment e"></path><path d="M 0 10 L 0 90 L 10 80 L 10 20 Z" class="segment f on"></path><path d="M 15 100 L 85 100 L 75 110 L 25 110 L 15 100 L 25 90 L 75 90 Z" class="segment g on"></path></svg><svg viewBox="-10 -10 120 220" class="digit-svg"><path d="M 10 0 L 90 0 L 80 10 L 20 10 Z" class="segment a on"></path><path d="M 100 10 L 100 90 L 90 80 L 90 20 Z" class="segment b on"></path><path d="M 100 110 L 100 190 L 90 180 L 90 120 Z" class="segment c on"></path><path d="M 10 200 L 90 200 L 80 190 L 20 190 Z" class="segment d on"></path><path d="M 0 110 L 0 190 L 10 180 L 10 120 Z" class="segment e on"></path><path d="M 0 10 L 0 90 L 10 80 L 10 20 Z" class="segment f on"></path><path d="M 15 100 L 85 100 L 75 110 L 25 110 L 15 100 L 25 90 L 75 90 Z" class="segment g"></path></svg></div>
    </div>

    <div class="footer-row">
        <div class="foul-box">
            <div id="home-foul" style="display:flex; gap:8px; justify-content: center;"><svg viewBox="-10 -10 120 220" class="foul-svg"><path d="M 10 0 L 90 0 L 80 10 L 20 10 Z" class="segment a"></path><path d="M 100 10 L 100 90 L 90 80 L 90 20 Z" class="segment b"></path><path d="M 100 110 L 100 190 L 90 180 L 90 120 Z" class="segment c"></path><path d="M 10 200 L 90 200 L 80 190 L 20 190 Z" class="segment d"></path><path d="M 0 110 L 0 190 L 10 180 L 10 120 Z" class="segment e"></path><path d="M 0 10 L 0 90 L 10 80 L 10 20 Z" class="segment f"></path><path d="M 15 100 L 85 100 L 75 110 L 25 110 L 15 100 L 25 90 L 75 90 Z" class="segment g"></path></svg><svg viewBox="-10 -10 120 220" class="foul-svg"><path d="M 10 0 L 90 0 L 80 10 L 20 10 Z" class="segment a on"></path><path d="M 100 10 L 100 90 L 90 80 L 90 20 Z" class="segment b on"></path><path d="M 100 110 L 100 190 L 90 180 L 90 120 Z" class="segment c on"></path><path d="M 10 200 L 90 200 L 80 190 L 20 190 Z" class="segment d on"></path><path d="M 0 110 L 0 190 L 10 180 L 10 120 Z" class="segment e on"></path><path d="M 0 10 L 0 90 L 10 80 L 10 20 Z" class="segment f on"></path><path d="M 15 100 L 85 100 L 75 110 L 25 110 L 15 100 L 25 90 L 75 90 Z" class="segment g on"></path></svg></div>
            <div class="label">TEAM FOULS</div>
        </div>
        
        <div class="shot-clock-box">
            <div id="shot-clock" style="display:flex; gap:10px; background:#000; padding:15px; border:3px solid #151515; border-radius: 4px;"><svg viewBox="-10 -10 120 220" class="shot-svg"><path d="M 10 0 L 90 0 L 80 10 L 20 10 Z" class="segment a on"></path><path d="M 100 10 L 100 90 L 90 80 L 90 20 Z" class="segment b on"></path><path d="M 100 110 L 100 190 L 90 180 L 90 120 Z" class="segment c"></path><path d="M 10 200 L 90 200 L 80 190 L 20 190 Z" class="segment d on"></path><path d="M 0 110 L 0 190 L 10 180 L 10 120 Z" class="segment e on"></path><path d="M 0 10 L 0 90 L 10 80 L 10 20 Z" class="segment f"></path><path d="M 15 100 L 85 100 L 75 110 L 25 110 L 15 100 L 25 90 L 75 90 Z" class="segment g on"></path></svg><svg viewBox="-10 -10 120 220" class="shot-svg"><path d="M 10 0 L 90 0 L 80 10 L 20 10 Z" class="segment a on"></path><path d="M 100 10 L 100 90 L 90 80 L 90 20 Z" class="segment b on"></path><path d="M 100 110 L 100 190 L 90 180 L 90 120 Z" class="segment c on"></path><path d="M 10 200 L 90 200 L 80 190 L 20 190 Z" class="segment d on"></path><path d="M 0 110 L 0 190 L 10 180 L 10 120 Z" class="segment e"></path><path d="M 0 10 L 0 90 L 10 80 L 10 20 Z" class="segment f"></path><path d="M 15 100 L 85 100 L 75 110 L 25 110 L 15 100 L 25 90 L 75 90 Z" class="segment g on"></path></svg></div>
            <div class="label" style="color:#622;">SHOT CLOCK</div>
        </div>

        <div class="foul-box">
            <div id="guest-foul" style="display:flex; gap:8px; justify-content: center;"><svg viewBox="-10 -10 120 220" class="foul-svg"><path d="M 10 0 L 90 0 L 80 10 L 20 10 Z" class="segment a"></path><path d="M 100 10 L 100 90 L 90 80 L 90 20 Z" class="segment b"></path><path d="M 100 110 L 100 190 L 90 180 L 90 120 Z" class="segment c"></path><path d="M 10 200 L 90 200 L 80 190 L 20 190 Z" class="segment d"></path><path d="M 0 110 L 0 190 L 10 180 L 10 120 Z" class="segment e"></path><path d="M 0 10 L 0 90 L 10 80 L 10 20 Z" class="segment f"></path><path d="M 15 100 L 85 100 L 75 110 L 25 110 L 15 100 L 25 90 L 75 90 Z" class="segment g"></path></svg><svg viewBox="-10 -10 120 220" class="foul-svg"><path d="M 10 0 L 90 0 L 80 10 L 20 10 Z" class="segment a on"></path><path d="M 100 10 L 100 90 L 90 80 L 90 20 Z" class="segment b on"></path><path d="M 100 110 L 100 190 L 90 180 L 90 120 Z" class="segment c on"></path><path d="M 10 200 L 90 200 L 80 190 L 20 190 Z" class="segment d on"></path><path d="M 0 110 L 0 190 L 10 180 L 10 120 Z" class="segment e on"></path><path d="M 0 10 L 0 90 L 10 80 L 10 20 Z" class="segment f on"></path><path d="M 15 100 L 85 100 L 75 110 L 25 110 L 15 100 L 25 90 L 75 90 Z" class="segment g"></path></svg></div>
            <div class="label">TEAM FOULS</div>
        </div>
    </div>
</div>

<div class="controls">
    <button onclick="startSimulation()">START</button>
    <button onclick="pauseSimulation()">PAUSE</button>
    <button onclick="resetSimulation()">RESET</button>
</div>

<script>
    const segmentsPath = {
        a: "M 10 0 L 90 0 L 80 10 L 20 10 Z",
        b: "M 100 10 L 100 90 L 90 80 L 90 20 Z",
        c: "M 100 110 L 100 190 L 90 180 L 90 120 Z",
        d: "M 10 200 L 90 200 L 80 190 L 20 190 Z",
        e: "M 0 110 L 0 190 L 10 180 L 10 120 Z",
        f: "M 0 10 L 0 90 L 10 80 L 10 20 Z",
        g: "M 15 100 L 85 100 L 75 110 L 25 110 L 15 100 L 25 90 L 75 90 Z"
    };

    const digitMap = {
        '0':['a','b','c','d','e','f'], '1':['b','c'], '2':['a','b','g','e','d'],
        '3':['a','b','g','c','d'], '4':['f','g','b','c'], '5':['a','f','g','c','d'],
        '6':['a','f','g','e','c','d'], '7':['a','b','c'], '8':['a','b','c','d','e','f','g'],
        '9':['a','b','c','d','f','g'], ' ':[]
    };

    let homeScore = 109, guestScore = 135, minutes = 10, seconds = 0, shotClock = 24, homeFoul = 8, guestFoul = 0;
    let interval = null;

    function createSVG(className) {
        const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
        svg.setAttribute("viewBox", "-10 -10 120 220");
        svg.classList.add(className);
        for (let s in segmentsPath) {
            const p = document.createElementNS("http://www.w3.org/2000/svg", "path");
            p.setAttribute("d", segmentsPath[s]);
            p.classList.add("segment", s);
            svg.appendChild(p);
        }
        return svg;
    }

    function draw(el, val) {
        if(!el) return;
        const activesegs = digitMap[val] || [];
        el.querySelectorAll('.segment').forEach(p => {
            const segID = p.classList[1];
            p.classList.toggle('on', activesegs.includes(segID));
        });
    }

    function init() {
        const hScoreCont = document.getElementById('home-score');
        const gScoreCont = document.getElementById('guest-score');
        for(let i=0; i<3; i++) {
            hScoreCont.appendChild(createSVG('digit-svg'));
            gScoreCont.appendChild(createSVG('digit-svg'));
        }

        document.getElementById('m-tens').appendChild(createSVG('timer-svg'));
        document.getElementById('m-units').appendChild(createSVG('timer-svg'));
        document.getElementById('s-tens').appendChild(createSVG('timer-svg'));
        document.getElementById('s-units').appendChild(createSVG('timer-svg'));

        const scCont = document.getElementById('shot-clock');
        scCont.appendChild(createSVG('shot-svg'));
        scCont.appendChild(createSVG('shot-svg'));

        const hfCont = document.getElementById('home-foul');
        const gfCont = document.getElementById('guest-foul');
        hfCont.appendChild(createSVG('foul-svg')); hfCont.appendChild(createSVG('foul-svg'));
        gfCont.appendChild(createSVG('foul-svg')); gfCont.appendChild(createSVG('foul-svg'));

        updateDisplay();
    }

    function updateDisplay() {
        const hStr = homeScore.toString().padStart(3, ' ');
        hStr.split('').forEach((v, i) => draw(document.getElementById('home-score').children[i], v));
        
        const gStr = guestScore.toString().padStart(3, ' ');
        gStr.split('').forEach((v, i) => draw(document.getElementById('guest-score').children[i], v));

        draw(document.getElementById('m-tens').firstChild, Math.floor(minutes/10));
        draw(document.getElementById('m-units').firstChild, minutes%10);
        draw(document.getElementById('s-tens').firstChild, Math.floor(seconds/10));
        draw(document.getElementById('s-units').firstChild, seconds%10);

        const shotStr = shotClock.toString().padStart(2, ' ');
        shotStr.split('').forEach((v, i) => draw(document.getElementById('shot-clock').children[i], v));

        draw(document.getElementById('home-foul').children[0], Math.floor(homeFoul/10) || ' ');
        draw(document.getElementById('home-foul').children[1], homeFoul%10);
        draw(document.getElementById('guest-foul').children[0], Math.floor(guestFoul/10) || ' ');
        draw(document.getElementById('guest-foul').children[1], guestFoul%10);
    }

    function startSimulation() {
        if (interval) return;
        interval = setInterval(() => {
            if (seconds === 0) {
                if (minutes > 0) { minutes--; seconds = 59; } 
                else { pauseSimulation(); }
            } else { seconds--; }
            if (shotClock > 0) { shotClock--; } else { shotClock = 24; }
            if (Math.random() > 0.98) homeScore += Math.floor(Math.random() * 3) + 1;
            if (Math.random() > 0.98) guestScore += Math.floor(Math.random() * 3) + 1;
            updateDisplay();
        }, 1000);
    }

    function pauseSimulation() { clearInterval(interval); interval = null; }
    function resetSimulation() {
        pauseSimulation();
        homeScore = 109; guestScore = 135; minutes = 10; seconds = 0; shotClock = 24; homeFoul = 8; guestFoul = 0;
        updateDisplay();
    }

    init();
</script>

</body></html>
